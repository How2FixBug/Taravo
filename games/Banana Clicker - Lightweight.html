<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banana Clicker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff8e8;color:#382b18;font:16px system-ui,Arial;display:grid;place-items:center;min-height:100vh}
main{width:min(760px,96vw);padding:18px}.game{background:#fff;border:3px solid #e9b84e;border-radius:22px;box-shadow:0 8px 0 #d99b2d;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,5vw,38px);color:#9a6500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#fff3cc;border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:clamp(19px,4vw,27px)}.stat small{color:#80602a}
.play{display:grid;grid-template-columns:1fr 1fr;gap:14px}.clickarea{background:#fff8df;border-radius:16px;display:grid;place-items:center;min-height:230px;position:relative}
.banana{width:145px;height:145px;object-fit:contain;cursor:pointer;user-select:none;transition:transform .08s;filter:drop-shadow(0 5px 2px #0002)}.banana:active{transform:scale(.9) rotate(-8deg)}
.shop{display:grid;gap:9px}.buy{border:0;border-radius:12px;background:#f3bd36;color:#382b18;text-align:left;padding:12px 14px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}.buy:hover{background:#ffd45e}.buy:disabled{opacity:.45;cursor:not-allowed}.buy span{font-size:12px;font-weight:500;display:block;color:#74521b}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools button{border:1px solid #e5c477;background:#fff9e9;padding:8px 11px;border-radius:9px;cursor:pointer;color:#634713}
#notice{min-height:20px;text-align:center;color:#9b6b12;font-size:13px;margin-top:9px}
@media(max-width:560px){.play{grid-template-columns:1fr}.clickarea{min-height:175px}.banana{width:125px;height:125px}}
</style>
<main><section class="game">
<header><h1>🍌 Banana Clicker</h1><button class="tools" id="reset">Reset</button></header>
<div class="stats"><div class="stat"><b id="bananas">0</b><small>Bananas</small></div><div class="stat"><b id="bpc">1</b><small>Per click</small></div><div class="stat"><b id="bps">0</b><small>Per second</small></div></div>
<div class="play"><div class="clickarea"><img id="banana" class="banana" alt="Click the banana"></div>
<div class="shop">
<button class="buy" id="clickUpgrade"><div>Click power<span>+1 banana per click</span></div><strong id="clickCost">5 🍌</strong></button>
<button class="buy" id="autoUpgrade"><div>Banana farm<span>+1 banana per second</span></div><strong id="autoCost">5 🍌</strong></button>
<button class="buy" id="maxClick"><div>MAX click power<span>Buy as many as you can</span></div><strong>MAX</strong></button>
<button class="buy" id="maxAuto"><div>MAX banana farms<span>Buy as many as you can</span></div><strong>MAX</strong></button>
</div></div>
<div class="tools"><button id="custom">Custom upgrade</button><button id="save">Save</button></div><div id="notice"></div>
</section></main>

const bananaImg=document.querySelector('#banana');
bananaImg.src=A["e5d3d3eb61797f5999732a8f5efead24.svg"];
let bananas=0,bpc=1,bps=0,clickCost=5,autoCost=5,last=performance.now();
const fmt=n=>Math.floor(n).toLocaleString();
function update(){document.querySelector('#bananas').textContent=fmt(bananas);document.querySelector('#bpc').textContent=fmt(bpc);document.querySelector('#bps').textContent=fmt(bps);
document.querySelector('#clickCost').textContent=fmt(clickCost)+' 🍌';document.querySelector('#autoCost').textContent=fmt(autoCost)+' 🍌';
document.querySelector('#clickUpgrade').disabled=bananas<clickCost;document.querySelector('#autoUpgrade').disabled=bananas<autoCost;
document.querySelector('#maxClick').disabled=bananas<clickCost;document.querySelector('#maxAuto').disabled=bananas<autoCost}
function buy(type){let cost=type==='click'?clickCost:autoCost,level=type==='click'?bpc:bps;let n=0;while(bananas>=cost&&n<100000){bananas-=cost;if(type==='click'){bpc++;clickCost=Math.floor(clickCost*1.5)}else{bps++;autoCost=Math.floor(autoCost*1.5)}cost=type==='click'?clickCost:autoCost;n++;if(!type)break}update();return n}
bananaImg.addEventListener('click',()=>{bananas+=bpc;bananaImg.animate([{transform:'scale(1)'},{transform:'scale(.9) rotate(-7deg)'},{transform:'scale(1)'}],{duration:150});update()});
document.querySelector('#clickUpgrade').onclick=()=>{if(bananas>=clickCost){bananas-=clickCost;bpc++;clickCost=Math.floor(clickCost*1.5);update()}};
document.querySelector('#autoUpgrade').onclick=()=>{if(bananas>=autoCost){bananas-=autoCost;bps++;autoCost=Math.floor(autoCost*1.5);update()}};
document.querySelector('#maxClick').onclick=()=>{let n=0;while(bananas>=clickCost&&n<100000){bananas-=clickCost;bpc++;clickCost=Math.floor(clickCost*1.5);n++}say('Bought '+n+' click upgrades');update()};
document.querySelector('#maxAuto').onclick=()=>{let n=0;while(bananas>=autoCost&&n<100000){bananas-=autoCost;bps++;autoCost=Math.floor(autoCost*1.5);n++}say('Bought '+n+' farms');update()};
document.querySelector('#custom').onclick=()=>{let type=prompt('Upgrade type? Enter BPC or BPS (or MAX):');if(type===null)return;let amount=prompt('How many upgrades?');if(amount===null)return;let n=Math.max(0,Math.floor(Number(amount)));type=type.trim().toUpperCase();if(type==='MAX'){type=prompt('MAX which type? BPC or BPS?')?.trim().toUpperCase()}if(type!=='BPC'&&type!=='BPS'){say('Use BPC or BPS.');return}let bought=0;while(bought<n&&bought<100000){let c=type==='BPC'?clickCost:autoCost;if(bananas<c)break;bananas-=c;if(type==='BPC'){bpc++;clickCost=Math.floor(clickCost*1.5)}else{bps++;autoCost=Math.floor(autoCost*1.5)}bought++}say('Purchased '+bought+' upgrades.');update()};
document.querySelector('#reset').onclick=()=>{if(confirm('Reset all progress?')){bananas=0;bpc=1;bps=0;clickCost=5;autoCost=5;update();say('Progress reset.')}};
document.querySelector('#save').onclick=()=>{localStorage.setItem('banana-clicker-save',JSON.stringify({bananas,bpc,bps,clickCost,autoCost}));say('Saved!')};
try{let s=JSON.parse(localStorage.getItem('banana-clicker-save'));if(s){({bananas,bpc,bps,clickCost,autoCost}=s)}}catch{}
function say(t){document.querySelector('#notice').textContent=t}
function tick(now){let dt=Math.min((now-last)/1000,1);last=now;bananas+=bps*dt;update();requestAnimationFrame(tick)}update();requestAnimationFrame(tick);
</script></html>
