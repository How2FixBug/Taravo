<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Stack Rush</title>
<link rel="stylesheet" href="game.css?v=3">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
.stack-shell{width:100%;height:100%;min-height:0;border:0;border-radius:0;box-shadow:none}
.stack-hints{display:none}
</style>
</head>
<body>
<button id="fullscreen-button" type="button" hidden></button>
<section class="stack-shell" id="game-shell" aria-label="Stack Rush game">
<div class="stack-hud"><div><span>SCORE</span><strong id="score">0</strong></div><div class="stack-hud-center"><span>BEST</span><strong id="best">0</strong></div><div class="stack-hud-right"><div><span>COMBO</span><strong id="combo">×1</strong></div><button class="stack-menu-button" id="menu-button" type="button" aria-label="Open menu" title="Menu">☰</button></div></div>
<canvas id="stackrush" width="1100" height="720" aria-label="Stack Rush. Place each moving block on the tower."></canvas>
<div class="stack-overlay" id="overlay"><div class="stack-overlay-card"><h2 id="overlay-title">Stack Rush</h2><div class="stack-menu-actions"><button id="start-button" type="button">Play</button><button id="settings-menu-button" class="stack-secondary" type="button">Settings</button><button id="restart-button" class="stack-secondary" type="button" hidden>Restart</button></div></div></div>
<div class="stack-settings-backdrop hidden" id="settings-backdrop" aria-hidden="true"><section class="stack-settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title"><button class="settings-close" id="close-settings" type="button" aria-label="Close settings">×</button><h2 id="settings-title">Settings</h2><label class="stack-setting-row" for="particles-toggle"><span>Particle effects</span><input id="particles-toggle" type="checkbox" checked></label><label class="stack-setting-row" for="shake-toggle"><span>Screen shake</span><input id="shake-toggle" type="checkbox" checked></label><div class="stack-setting-row"><span>Best score</span><button id="reset-best" class="reset-best" type="button">Reset</button></div></section></div>
</section>
<script src="game.js?v=3"></script>
</body>
</html>
