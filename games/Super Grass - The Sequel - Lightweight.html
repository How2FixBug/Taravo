const imgCache={};function image(id){if(!A[id])return null;if(!imgCache[id]){let i=new Image();i.src=A[id];imgCache[id]=i}return imgCache[id]}
const canvas=document.querySelector('#field'),ctx=canvas.getContext('2d');
const ids={sky:"e7ff86fbc06683d5a06c2a835cd9bdd4.svg",sky2:"e7ff86fbc06683d5a06c2a835cd9bdd4.svg"2,grass:"5706ea534a0003b14b0e9a93f95bc9f0.svg",grass2:"5706ea534a0003b14b0e9a93f95bc9f0.svg"2,sun:"e9584360b93e94e89f693afcc6bee01e.svg",cloud:"55fc2f0ea5e8b5942fc1df717deeaa17.svg",cloud2:"55fc2f0ea5e8b5942fc1df717deeaa17.svg"2,mower:"3065687a7a742a4d1d443b4c440ee5de.svg"};
let grassHeight=75,clouds=0,time=0,best=Number(localStorage.getItem('super-grass-best')||0),lost=false,mowerX=780,last=performance.now(),cloudCooldown=0;
document.querySelector('#best').textContent=best.toFixed(1);
function drawAsset(id,x,y,w,h,alpha=1){let im=image(ids[id]);if(im&&im.complete&&im.naturalWidth){ctx.globalAlpha=alpha;ctx.drawImage(im,x,y,w,h);ctx.globalAlpha=1;return true}return false}
function paint(){ctx.clearRect(0,0,800,480);let bg=image(ids.sky);if(bg&&bg.complete)ctx.drawImage(bg,0,0,800,480);else{let g=ctx.createLinearGradient(0,0,0,480);g.addColorStop(0,'#82d5ff');g.addColorStop(1,'#e6f9ff');ctx.fillStyle=g;ctx.fillRect(0,0,800,480)}
// sun
drawAsset('sun',625,30,135,135); 
// clouds: clickable targets
for(let i=0;i<3;i++){let x=80+i*230,y=45+(i%2)*30; if(!drawAsset('cloud',x,y,135,85)){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+45,y+42,28,0,7);ctx.arc(x+75,y+27,35,0,7);ctx.arc(x+105,y+45,27,0,7);ctx.fill()}}
let h=Math.min(grassHeight,390);if(!drawAsset('grass',0,480-h,800,h)){ctx.fillStyle='#4cae3e';ctx.fillRect(0,480-h,800,h);for(let x=0;x<800;x+=16){ctx.strokeStyle='#328d2e';ctx.beginPath();ctx.moveTo(x,480-h);ctx.lineTo(x-5,480-h-9);ctx.stroke()}}
if(!lost){ctx.fillStyle='#235b29';ctx.font='bold 22px system-ui';ctx.fillText('Keep the grass under control!',22,450)}else{ctx.fillStyle='#193c24';ctx.fillRect(0,0,800,480);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 44px system-ui';ctx.fillText('TOO MUCH "5706ea534a0003b14b0e9a93f95bc9f0.svg"!',400,215);ctx.font='22px system-ui';ctx.fillText('Press Restart to try again',400,260);ctx.textAlign='left'}
if(mowerX<800){if(!drawAsset('mower',mowerX,350,110,70)){ctx.fillStyle='#e5e5e5';ctx.fillRect(mowerX,375,95,35);ctx.fillStyle='#333';ctx.fillRect(mowerX+15,405,15,15);ctx.fillRect(mowerX+70,405,15,15)}}
}
function updateHud(){document.querySelector('#time').textContent=time.toFixed(1);document.querySelector('#best').textContent=best.toFixed(1)}
function reset(){grassHeight=65;clouds=0;time=0;lost=false;mowerX=780;cloudCooldown=0;last=performance.now();document.querySelector('#mow').disabled=false;updateHud();paint()}
canvas.addEventListener('click',e=>{if(lost)return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*800/r.width,y=(e.clientY-r.top)*480/r.height;if(y<155&&x<590){clouds=Math.min(20,clouds+1);cloudCooldown=10;grassHeight=Math.max(55,grassHeight-10)}});
document.querySelector('#mow').onclick=()=>{if(lost)return;grassHeight=65;clouds=0;mowerX=780;let start=performance.now();document.querySelector('#mow').disabled=true;let run=()=>{let p=(performance.now()-start)/2500;mowerX=780-920*Math.min(1,p);paint();if(p<1)requestAnimationFrame(run);else{mowerX=780;document.querySelector('#mow').disabled=false;grassHeight=70;paint()}};requestAnimationFrame(run)};
document.querySelector('#restart').onclick=reset;
function frame(now){let dt=Math.min((now-last)/1000,.08);last=now;if(!lost){time+=dt;cloudCooldown=Math.max(0,cloudCooldown-dt);let speed=cloudCooldown>0?.4:1;grassHeight+=dt*(18+clouds*1.6)*speed;if(grassHeight>390){lost=true;best=Math.max(best,time);localStorage.setItem('super-grass-best',best);document.querySelector('#mow').disabled=true}updateHud()}paint();requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
