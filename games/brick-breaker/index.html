<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Brick Breaker — taravo</title>
  <link rel="stylesheet" href="../../home/style.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../home/global-settings.js" defer></script>
</head>
<body data-page="game" class="game-page">
  <aside class="sidebar">
    <a class="brand" href="../../home/" aria-label="taravo home">taravo</a>
    <nav class="navigation" aria-label="Main navigation">
      <a class="nav-link" href="../../home/"><span class="nav-icon">⌂</span>Home</a>
      <a class="nav-link active" href="../"><span class="nav-icon">▦</span>Games</a>
      <a class="nav-link" href="../../favorites/"><span class="nav-icon">☆</span>Favorites</a>
      <a class="nav-link" href="../../settings/"><span class="nav-icon">⚙</span>Settings</a>
    </nav>
    <div class="sidebar-bottom"><span class="sidebar-caption">fun games</span></div>
  </aside>
  <main class="main-content">
    <header class="page-header game-page-header"><div><h1>Brick Breaker</h1></div><button class="page-fullscreen-button" id="fullscreen-button" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶ <span>Fullscreen</span></button></header>
    <section class="arcade-shell" aria-label="Brick Breaker game">
      <div class="arcade-hud">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div><span>LEVEL</span><strong id="level">1</strong></div>
        <div class="hud-right"><div><span>BEST</span><strong id="best">0</strong></div><button class="icon-button" id="menu-button" type="button" aria-label="Open menu" title="Menu">☰</button></div>
      </div>
      <canvas id="brick-breaker" width="1100" height="720" aria-label="Brick Breaker game"></canvas>
      <div class="arcade-overlay" id="overlay">
        <div class="arcade-start">
          <h2 id="overlay-title">Brick Breaker</h2>
          <div class="menu-actions"><button id="start-button" type="button">Play</button><button id="settings-button" class="secondary-button" type="button">Settings</button><button id="secondary-button" class="secondary-button" type="button" hidden>Restart</button></div>
        </div>
      </div>
      <div class="game-settings-backdrop hidden" id="game-settings" aria-hidden="true"><section class="game-settings-panel" role="dialog" aria-modal="true" aria-labelledby="game-settings-title"><button class="settings-close" id="close-game-settings" type="button" aria-label="Close settings">×</button><h2 id="game-settings-title">Brick Breaker settings</h2><div class="game-setting-row"><label for="particles">Particle effects</label><input id="particles" type="checkbox"></div><div class="game-setting-row sensitivity-control"><label for="sensitivity">Paddle sensitivity <strong id="sensitivity-value">100%</strong></label><input id="sensitivity" type="range" min="50" max="150" step="10" value="100"></div><div class="game-setting-row"><span>Game data</span><button class="reset-score" id="reset-data" type="button">Reset data</button></div></section></div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
