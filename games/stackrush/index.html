<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>Stack Rush — taravo</title>
  <link rel="stylesheet" href="../../home/style.css">
  <link rel="stylesheet" href="game.css">
  <script src="../../home/global-settings.js" defer></script>
</head>
<body data-page="game" class="game-page">
  <aside class="sidebar">
    <a class="brand" href="../../home/" aria-label="taravo home">taravo</a>
    <nav class="navigation" aria-label="Main navigation">
      <a class="nav-link" href="../../home/"><span class="nav-icon">⌂</span>Home</a>
      <a class="nav-link active" href="../"><span class="nav-icon">▦</span>Games</a>
      <a class="nav-link" href="../../favorites/"><span class="nav-icon">☆</span>Favorites</a>
      <a class="nav-link" href="../../settings/"><span class="nav-icon">⚙</span>Settings</a>
    </nav>
    <div class="sidebar-bottom"><span class="sidebar-caption">fun games</span></div>
  </aside>
  <main class="main-content">
    <header class="page-header game-page-header">
      <div class="game-heading"><a class="back-link" href="../" aria-label="Back to games">←</a><h1>Stack Rush</h1></div>
      <button class="page-fullscreen-button" id="fullscreen-button" type="button" title="Fullscreen">⛶ <span>Fullscreen</span></button>
    </header>
    <section class="stack-shell" id="game-shell" aria-label="Stack Rush game">
      <div class="stack-hud">
        <div><span>SCORE</span><strong id="score">0</strong></div>
        <div class="stack-hud-center"><span>BEST</span><strong id="best">0</strong></div>
        <div class="stack-hud-right"><div><span>COMBO</span><strong id="combo">×1</strong></div><button class="stack-menu-button" id="settings-button" type="button" aria-label="Game settings" title="Settings">⚙</button></div>
      </div>
      <canvas id="stackrush" width="1100" height="720" aria-label="Stack Rush. Place each moving block on the tower."></canvas>
      <div class="stack-overlay" id="overlay">
        <div class="stack-overlay-card">
          <h2 id="overlay-title">Stack Rush</h2>
          <button id="start-button" type="button">Play</button>
        </div>
      </div>
      <div class="stack-settings-backdrop hidden" id="settings-backdrop" aria-hidden="true">
        <section class="stack-settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <button class="settings-close" id="close-settings" type="button" aria-label="Close settings">×</button>
          <h2 id="settings-title">Settings</h2>
          <label class="stack-setting-row" for="particles-toggle"><span>Particle effects</span><input id="particles-toggle" type="checkbox" checked></label>
          <label class="stack-setting-row" for="shake-toggle"><span>Screen shake</span><input id="shake-toggle" type="checkbox" checked></label>
          <div class="stack-setting-row"><span>Best score</span><button id="reset-best" class="reset-best" type="button">Reset</button></div>
        </section>
      </div>
    </section>
    <div class="stack-hints"><span><kbd>SPACE</kbd> / TAP TO PLACE</span><span>LEFT / RIGHT TO ROTATE VIEW</span></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
