<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Stackrush — taravo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="game">
  <aside class="sidebar">
    <a class="brand" href="../../home/" aria-label="taravo home">taravo</a>
    <nav class="navigation" aria-label="Main navigation">
      <a class="nav-link" href="../../home/"><span class="nav-icon">⌂</span>Home</a>
      <a class="nav-link active" href="../"><span class="nav-icon">▦</span>Games</a>
      <a class="nav-link" href="../../favorites/"><span class="nav-icon">☆</span>Favorites</a>
    </nav>
    <div class="sidebar-bottom"><span class="sidebar-caption">taravo</span></div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div class="game-heading">
        <a class="back-link" href="../">← Games</a>
        <h1>Stackrush</h1>
      </div>
      <div class="game-best">BEST <strong id="best">0</strong></div>
    </header>

    <div class="game-columns">
      <section class="play-column">
        <div class="game-stage">
          <div class="game-hud">
            <div><span>STACK</span><strong id="score">0</strong></div>
            <div><span>PERFECT</span><strong id="perfect">0</strong></div>
          </div>
          <canvas id="game" width="1000" height="680" aria-label="Stackrush 3D stacking game"></canvas>
          <div class="game-overlay" id="overlay">
            <div class="overlay-card">
              <h2 id="overlay-title">Stackrush</h2>
              <p id="overlay-copy">Click or press Space to drop a block.</p>
              <button id="start">Play</button>
            </div>
          </div>
        </div>
        <div class="game-controls"><span>CLICK / SPACE / TAP TO DROP</span><span>STACK AS HIGH AS YOU CAN</span></div>
      </section>

      <aside class="game-rail">
        <h2>Controls</h2>
        <div class="control-card"><span>DROP BLOCK</span><strong>CLICK</strong></div>
        <div class="control-card"><span>KEYBOARD</span><strong>SPACE</strong></div>
      </aside>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
