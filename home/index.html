<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>taravo — fun games</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
  <script src="global-settings.js" defer></script>
</head>
<body data-page="home">
  <aside class="sidebar">
    <a class="brand" href="./" aria-label="taravo home">taravo</a>
    <nav class="navigation" aria-label="Main navigation">
      <a class="nav-link active" href="./"><span class="nav-icon">⌂</span>Home</a>
      <a class="nav-link" href="../games/"><span class="nav-icon">▦</span>Games</a>
      <a class="nav-link" href="../favorites/"><span class="nav-icon">☆</span>Favorites</a>

    </nav>
    <div class="sidebar-bottom"><span class="sidebar-caption">fun games</span></div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <div>
        <h1>Home</h1>
        <p class="tagline">fun games</p>
      </div>
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input class="game-search" type="search" placeholder="Search games..." aria-label="Search games">
      </label>

    <section class="content-section recommended-section">
      <div class="section-heading">
